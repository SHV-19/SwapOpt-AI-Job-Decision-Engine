name: V4 Showcase CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-public-v4:
    name: Validate public V4 intelligence slice
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify public-source boundary
        run: node scripts/verify-public-showcase.mjs

      - name: Syntax-check curated V4 backend
        shell: bash
        run: |
          find backend -type f -name '*.js' -print0 |
            xargs -0 -n1 node --check

      - name: Run representative V4 intelligence tests
        run: >
          node --test
          tests/unit/services/application-behavior-intelligence.test.js
          tests/unit/services/career-learning-loop-intelligence.test.js
          tests/unit/services/career-outcome-engine-service.test.js
          tests/unit/services/market-intelligence-service.test.js
          tests/unit/services/personal-market-strategy.test.js
